<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Planet Surface Walk</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; cursor: grab; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202030);

// PLANET
const planetRadius = 2;
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(planetRadius, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x55aaff })
);
scene.add(planet);

// LIGHTS
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 10, 10);
scene.add(light);
scene.add(new THREE.AmbientLight(0x555555));

// CHARACTER (кубик)
const char = new THREE.Mesh(
  new THREE.BoxGeometry(0.2,0.2,0.2),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
scene.add(char);

// HOUSES
const houseGeometry = new THREE.BoxGeometry(0.15,0.15,0.15);
const houseMaterials = [
  new THREE.MeshStandardMaterial({ color: 0xffaa00 }),
  new THREE.MeshStandardMaterial({ color: 0xaa44ff }),
  new THREE.MeshStandardMaterial({ color: 0x44ff88 })
];

function addHouse(lat, lon, material) {
  const radius = planetRadius + 0.1;
  const x = radius * Math.sin(lat) * Math.cos(lon);
  const y = radius * Math.cos(lat);
  const z = radius * Math.sin(lat) * Math.sin(lon);
  const house = new THREE.Mesh(houseGeometry, material);
  house.position.set(x,y,z);
  house.lookAt(0,0,0);
  scene.add(house);
}

addHouse(Math.PI/3,0,houseMaterials[0]);
addHouse(Math.PI/2.2,1,houseMaterials[1]);
addHouse(Math.PI/2.5,2,houseMaterials[2]);
addHouse(Math.PI/1.8,-1,houseMaterials[0]);

// CAMERA
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// SPHERICAL POSITION
let theta = Math.PI/2; // от северного полюса
let phi = 0; // долгота
const charRadius = planetRadius + 0.5;

// CONTROLS
let keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

let mouseDown = false, prevX=0, prevY=0;
let yaw = 0, pitch = 0;
document.addEventListener('mousedown', e => { mouseDown=true; prevX=e.clientX; prevY=e.clientY; });
document.addEventListener('mouseup', e => mouseDown=false);
document.addEventListener('mousemove', e => {
  if(!mouseDown) return;
  const dx = (e.clientX-prevX)/200;
  const dy = (e.clientY-prevY)/200;
  yaw -= dx;
  pitch -= dy;
  pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch));
  prevX=e.clientX; prevY=e.clientY;
});

// MOVE FUNCTION (по сфере)
function move() {
  const speed = 0.02;
  // пересчитываем движение по углам
  let deltaTheta = 0, deltaPhi = 0;

  const forward = new THREE.Vector3(
    Math.sin(theta)*Math.cos(phi),
    Math.cos(theta),
    Math.sin(theta)*Math.sin(phi)
  );

  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

  if(keys['KeyW'] || keys['ArrowUp']) {
    deltaTheta -= speed * Math.cos(pitch);
    deltaPhi   -= speed * Math.sin(yaw);
  }
  if(keys['KeyS'] || keys['ArrowDown']) {
    deltaTheta += speed * Math.cos(pitch);
    deltaPhi   += speed * Math.sin(yaw);
  }
  if(keys['KeyA'] || keys['ArrowLeft']) {
    deltaPhi -= speed;
  }
  if(keys['KeyD'] || keys['ArrowRight']) {
    deltaPhi += speed;
  }

  theta += deltaTheta;
  phi += deltaPhi;

  // позиция персонажа
  const x = charRadius * Math.sin(theta) * Math.cos(phi);
  const y = charRadius * Math.cos(theta);
  const z = charRadius * Math.sin(theta) * Math.sin(phi);
  char.position.set(x,y,z);
  char.lookAt(0,0,0);

  // CAMERA third-person
  const gravity = char.position.clone().normalize();
  const camOffset = new THREE.Vector3(0,0.5,1.2); // над спиной и чуть позади
  const yawQuat = new THREE.Quaternion().setFromAxisAngle(gravity, yaw);
  const rightVec = new THREE.Vector3().crossVectors(camOffset, gravity).normalize();
  const pitchQuat = new THREE.Quaternion().setFromAxisAngle(rightVec, pitch);
  const totalQuat = new THREE.Quaternion().multiplyQuaternions(yawQuat, pitchQuat);
  camOffset.applyQuaternion(totalQuat);

  camera.position.copy(char.position.clone().add(camOffset));
  camera.lookAt(char.position);
}

// ANIMATE
function animate() {
  requestAnimationFrame(animate);
  move();
  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

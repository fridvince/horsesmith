<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Planet City Walk</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202030);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(20, 20, 20);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x555555));

  const planetRadius = 5;
  const planetGeometry = new THREE.SphereGeometry(planetRadius, 64, 64);
  const planetMaterial = new THREE.MeshStandardMaterial({ color: 0x55aaff });
  const planet = new THREE.Mesh(planetGeometry, planetMaterial);
  scene.add(planet);

  const houseGeometry = new THREE.BoxGeometry(2, 2, 2);
  const houseMaterials = [
    new THREE.MeshStandardMaterial({ color: 0xffaa00 }),
    new THREE.MeshStandardMaterial({ color: 0xaa44ff }),
    new THREE.MeshStandardMaterial({ color: 0x44ff88 })
  ];

  function addHouse(lat, lon, material) {
    const radius = planetRadius + 1;
    const x = radius * Math.sin(lat) * Math.cos(lon);
    const y = radius * Math.cos(lat);
    const z = radius * Math.sin(lat) * Math.sin(lon);

    const house = new THREE.Mesh(houseGeometry, material);
    house.position.set(x, y, z);
    house.lookAt(0, 0, 0);
    scene.add(house);
  }

  addHouse(Math.PI/3, 0, houseMaterials[0]);
  addHouse(Math.PI/2.2, 1, houseMaterials[1]);
  addHouse(Math.PI/2.5, 2, houseMaterials[2]);
  addHouse(Math.PI/1.8, -1, houseMaterials[0]);
  addHouse(Math.PI/2.7, -2, houseMaterials[1]);

  let radius = planetRadius + 2; 
  let lat = Math.PI/2; 
  let lon = 0;

  const keys = {};
  document.addEventListener('keydown', e => keys[e.code] = true);
  document.addEventListener('keyup', e => keys[e.code] = false);

  function move() {
    const speed = 0.2;

    const gravity = new THREE.Vector3().copy(camera.position).normalize();

    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.projectOnPlane(gravity).normalize();

    const right = new THREE.Vector3().crossVectors(forward, gravity).normalize();

    if (keys['KeyW'] || keys['ArrowUp']) camera.position.addScaledVector(forward, speed);
    if (keys['KeyS'] || keys['ArrowDown']) camera.position.addScaledVector(forward, -speed);
    if (keys['KeyA'] || keys['ArrowLeft']) camera.position.addScaledVector(right, -speed);
    if (keys['KeyD'] || keys['ArrowRight']) camera.position.addScaledVector(right, speed);

    camera.position.setLength(radius);

    camera.up.copy(gravity);

    camera.lookAt(camera.position.clone().add(forward));
  }

  function animate() {
    requestAnimationFrame(animate);
    move();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
